<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fit insight prototype</title>
<style>
 body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f6f7;color:#282c3f}
 header{background:#fff;padding:14px 28px;border-bottom:1px solid #eaeaec;font-weight:700;letter-spacing:.5px}
 main{max-width:980px;margin:24px auto;display:flex;gap:28px;padding:0 16px}
 .img{flex:0 0 360px;height:460px;background:linear-gradient(160deg,#e9e3f5,#f7e8ee);border-radius:6px;
      display:flex;align-items:center;justify-content:center;color:#7e818c;font-size:14px}
 .info{flex:1}
 h1{font-size:22px;margin:0 0 4px} .sub{color:#7e818c;margin-bottom:18px}
 .sizes{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 18px}
 .sizes button{border:1px solid #d4d5d9;background:#fff;border-radius:24px;padding:9px 16px;font:inherit;cursor:pointer}
 .sizes button.sel{border-color:#ff3f6c;color:#ff3f6c;font-weight:600}
 .fit{border:1px solid #eaeaec;background:#fff;border-radius:6px;padding:14px 16px;min-height:74px}
 .fit .head{font-weight:700;margin-bottom:6px} .up{color:#c05600} .down{color:#2b6cb0} .ok{color:#03a685}
 .ev{color:#535766;font-size:14px} .note{margin-top:14px;font-size:12px;color:#94969f}
 select{font:inherit;padding:6px;margin-bottom:12px}
</style></head><body>
<header>FASHION STORE · PROTOTYPE</header>
<main>
 <div class="img">product image</div>
 <div class="info">
  <select id="item"></select>
  <h1 id="title"></h1><div class="sub" id="sub"></div>
  <div><strong>Select size</strong></div>
  <div class="sizes" id="sizes"></div>
  <div class="fit" id="fit"><div class="ev">Pick a size to see how it fits people who wore that size.</div></div>
  <div class="note">Advice comes from a model trained on reviews before 2017. Evidence counts are real
   past reviews of this item at that size.</div>
 </div>
</main>
<script>
const ITEMS = [{"item_id": "174086", "category": "dress", "train_reviews": 1688, "bands": {"0": {"p_small": 0.033687328138750305, "p_large": 0.18333811472383132, "hist_n": 521, "hist_small": 0.030710172744721688, "hist_large": 0.22840690978886757}, "1": {"p_small": 0.04527047041965225, "p_large": 0.13249910656326255, "hist_n": 354, "hist_small": 0.0423728813559322, "hist_large": 0.14689265536723164}, "2": {"p_small": 0.1062998777803621, "p_large": 0.052523298153467526, "hist_n": 293, "hist_small": 0.09556313993174062, "hist_large": 0.04436860068259386}, "3": {"p_small": 0.1059329022809852, "p_large": 0.06097892439338008, "hist_n": 191, "hist_small": 0.17277486910994763, "hist_large": 0.08376963350785341}, "4": {"p_small": 0.13598702956280453, "p_large": 0.06723551836799484, "hist_n": 131, "hist_small": 0.16030534351145037, "hist_large": 0.08396946564885496}, "5": {"p_small": 0.11178294072771931, "p_large": 0.05416766766373448, "hist_n": 198, "hist_small": 0.09090909090909091, "hist_large": 0.06060606060606061}}}, {"item_id": "136110", "category": "dress", "train_reviews": 1117, "bands": {"0": {"p_small": 0.0903616539222605, "p_large": 0.03515227295424947, "hist_n": 179, "hist_small": 0.1005586592178771, "hist_large": 0.0223463687150838}, "1": {"p_small": 0.14484663615201157, "p_large": 0.020874475515432225, "hist_n": 158, "hist_small": 0.14556962025316456, "hist_large": 0.006329113924050633}, "2": {"p_small": 0.20625044415753685, "p_large": 0.022085943701316592, "hist_n": 196, "hist_small": 0.15306122448979592, "hist_large": 0.025510204081632654}, "3": {"p_small": 0.24886104565903475, "p_large": 0.024039933827709192, "hist_n": 161, "hist_small": 0.19875776397515527, "hist_large": 0.031055900621118012}, "4": {"p_small": 0.3400270764853693, "p_large": 0.01701299371715994, "hist_n": 136, "hist_small": 0.25735294117647056, "hist_large": 0.014705882352941176}, "5": {"p_small": 0.3891509737712521, "p_large": 0.018452978674758185, "hist_n": 287, "hist_small": 0.3519163763066202, "hist_large": 0.017421602787456445}}}, {"item_id": "126335", "category": "dress", "train_reviews": 2114, "bands": {"0": {"p_small": 0.028759134903576077, "p_large": 0.2606315282299728, "hist_n": 265, "hist_small": 0.022641509433962263, "hist_large": 0.39622641509433965}, "1": {"p_small": 0.03180846112160723, "p_large": 0.16184420031044125, "hist_n": 381, "hist_small": 0.031496062992125984, "hist_large": 0.2073490813648294}, "2": {"p_small": 0.03509577796827981, "p_large": 0.16250104180609337, "hist_n": 348, "hist_small": 0.03735632183908046, "hist_large": 0.2557471264367816}, "3": {"p_small": 0.03090723616556658, "p_large": 0.13920465957295497, "hist_n": 312, "hist_small": 0.016025641025641024, "hist_large": 0.23397435897435898}, "4": {"p_small": 0.039838619381140125, "p_large": 0.1419783558309145, "hist_n": 271, "hist_small": 0.025830258302583026, "hist_large": 0.17712177121771217}, "5": {"p_small": 0.12037614521267931, "p_large": 0.06983748381408918, "hist_n": 537, "hist_small": 0.10800744878957169, "hist_large": 0.1042830540037244}}}], BANDS = ["0\u20134", "5\u20138", "9\u201312", "13\u201316", "17\u201320", "21+"], MARGIN = 0.1;
const pct = (x) => Math.round(x * 100) + "%";
const sel = document.getElementById("item");
sel.innerHTML = ITEMS.map((it, i) => `<option value="${i}">Item ${it.item_id} (${it.category})</option>`).join("");
function show(i) {
  const it = ITEMS[i];
  document.getElementById("title").textContent = `Item ${it.item_id}`;
  document.getElementById("sub").textContent = `${it.category} · ${it.train_reviews.toLocaleString()} past reviews`;
  const box = document.getElementById("sizes");
  box.innerHTML = BANDS.map((b, k) => it.bands[k] ? `<button data-k="${k}">${b}</button>` : "").join("");
  box.querySelectorAll("button").forEach(btn => btn.onclick = () => pick(it, btn));
  document.getElementById("fit").innerHTML = '<div class="ev">Pick a size to see how it fits people who wore that size.</div>';
}
function pick(it, btn) {
  document.querySelectorAll(".sizes button").forEach(b => b.classList.remove("sel"));
  btn.classList.add("sel");
  const v = it.bands[btn.dataset.k], d = v.p_small - v.p_large;
  let head, cls;
  if (d >= MARGIN) { head = "Runs small at this size: consider one size up"; cls = "up"; }
  else if (-d >= MARGIN) { head = "Runs large at this size: consider one size down"; cls = "down"; }
  else { head = "True to size for most people at this size"; cls = "ok"; }
  const ev = v.hist_n ? `${pct(v.hist_small)} of ${v.hist_n} past renters in sizes ${BANDS[btn.dataset.k]} said too small, ${pct(v.hist_large)} too large.`
                      : "No past reviews at this size yet; advice is based on similar items and sizes.";
  document.getElementById("fit").innerHTML = `<div class="head ${cls}">${head}</div><div class="ev">${ev}</div>`;
}
sel.onchange = () => show(sel.value);
show(0);
</script></body></html>
